d be.\n\n[8:45 PART SIX — HOW YOU LEAVE] The worst way to end a conversation is letting it deflate until somebody escapes. The best way is ending it while it is still good, on purpose, with a specific next step. Something like: I am going to let you get back to it, I will send you that thing on Monday.\n\nThen send it on Monday. That single follow-through puts you ahead of nearly everyone they met that night.\n\n[10:00 PART SEVEN — WHAT HAPPENS AFTER] Once you are actually inside a network, you find out everyone already knows everyone, and the entire thing runs on whether people vouch for you. Which means your reputation in that circle is being built by things that seem small. Being on time. Not name-dropping. Not asking for the big thing at the second meeting. Following up when you said you would.\n\n[11:00 CLOSE] Better rooms, arrive early, bring something, give them a door, talk less, leave clean, follow through. None of that requires you to be charismatic. It requires you to be deliberate, and almost nobody is, which is the entire opportunity.","production":"Seated, single take. Consider one b-roll insert of a real event environment for the room section. Chapter markers per part — this one gets watched in pieces. Title on YouTube: How to Actually Work a Room. Pin the seven-step summary as the first comment.","cta":"Which of the seven do you already do, and which one did you know you were avoiding?","heuristics":["Authority","Reciprocation","Specificity","Disqualified identity bias"],"source":"300 Video Content Matrix — 'Networking Is Rigged', 'Stop Going to Free Events + Master Energy Management', 'What Do You Have That's Useful to the Gatekeeper?', 'The Most Underrated Skill in Conversation: Silence', 'The Worst vs. Best Way to End a Conversation', 'Once You're In, Everyone Already Knows Everyone', 'Everyone's More Nervous Than You', '3 Things That Quietly Kill Your Reputation at Events'","flag":null},{"n":27,"date":"2026-10-10","dow":"Sat","week":4,"platform":"Short-form video","pillar":"Mindset","format":"YAP + B-roll, 45-60s","title":"Seventeen million views, ten thousand dollar months","hooks":["Seventeen million views and ten thousand dollar months. Those two numbers belong to the same person.","Attention and money are different games and almost nobody tells you that until you have already won the wrong one.","I have watched people get everything they said they wanted and still be broke."],"script":"Seventeen million views in a year, and ten thousand dollar months across that same year, and both of those numbers belong to the same person.\n\nI have watched this happen enough times now that it stopped being surprising and started being the thing I check for. Attention and money are two separate games and winning one does not hand you the other, and the gap between them is where a lot of people quietly lose a few years.\n\nWhat is actually happening is that the content was built to be watched instead of built to sell something, and those are different jobs. Watchable content optimizes for the reaction. Content that earns optimizes for the person who has a problem you can solve, and there are far fewer of those people, and they are much less fun to make things for.\n\nSo you end up performing for an audience that was never going to buy anything, getting rewarded constantly by the numbers, and the reward is real enough that you keep going.\n\nThe fix is uncomfortable and specific. Decide who the content is for, and accept that the right person is a much smaller number than the number you are currently chasing. A thousand of the right people beats seventeen million of the wrong ones, and the second one feels much better on the way down.\n\nProof beats performance. Even in content.","production":"Talking head, plain. B-roll: an analytics dashboard with a huge view count, then a bank balance blurred out. On-screen — 17M VIEWS / $10K MONTHS side by side, held long enough to land.","cta":"Are you making content for people who watch, or people who buy? They are not the same list.","heuristics":["Contrast misreaction","Disarming honesty","Specificity"],"source":"300 Video Content Matrix — '17 Million Views, $10K Months: The Dancing Monkey Realization' (Mindset / Contradiction)","flag":"CONFIRM whose numbers these are. The script frames them as somebody Julius watched, not as his own. If they are his, rewrite in first person — it is a stronger post. If they belong to a specific person who is identifiable, keep it anonymous as written."},{"n":28,"date":"2026-10-11","dow":"Sun","week":4,"platform":"X","pillar":"Mindset","format":"Short standalone post","title":"Year two against somebody's year nine","hooks":["I spent a long stretch comparing my year two to somebody else's year nine and calling the result evidence.","The comparison that was quietly wrecking me had a date problem in it.","Almost every time I have felt behind, I was measuring against a number with seven extra years in it."],"script":"For a long stretch I compared my year two to other people's year nine and treated the gap as information about me.\n\nIt was information about a calendar.\n\nThe thing that makes this hard to catch is that year nine is the only version of anybody you ever see. Nobody posts the part where they were two years in, undercharging, taking clients they should not have taken, and privately unsure whether the whole thing was a mistake. That footage does not exist for anyone, so the comparison is always against a highlight from a season you have not reached.\n\nWhat helped was replacing the person with a date. Comparing my year two to my own year one is a real measurement with real information in it, and it is the only comparison that has ever changed a decision I made.\n\nStill run at them. Just stop reading the gap as a verdict.","cta":"None.","heuristics":["Disarming honesty bias","Contrast misreaction","Specificity"],"source":"300 Video Content Matrix — 'Comparing Year 2 of My Journey to Someone's Year 9' (Mindset / Conflicting Comparison)","flag":null},{"n":29,"date":"2026-10-12","dow":"Mon","week":5,"platform":"LinkedIn","pillar":"Associations","format":"Long text post","title":"What holding four things at once actually looks like","hooks":["Two fractional CMO seats, one agency, one law degree, at the same time. Here is the unglamorous version.","People assume running several things at once means being productive. Mostly it means being ruthless about what gets dropped.","I want to describe the actual mechanics of this, because the version people imagine is wrong."],"script":"Right now I am running Velocity Demos, holding two active fractional CMO seats at other companies, and finishing a legal studies degree at UGA with a business and real estate focus.\n\nPeople assume that means exceptional productivity. The honest mechanism is closer to ruthless subtraction, and I want to describe it, because the imagined version of this life is wrong in a way that makes people feel bad about themselves.\n\nThe first thing is that fractional work is only possible because the diagnosis is the expensive part and it happens once. Coming into a company, finding what is actually broken in the positioning, and setting the direction is maybe three weeks of real thinking. Everything after that is execution that someone else should be doing, and the value I add in month six is a fraction of what I add in week two. Structuring the engagement around that means the calendar stops competing with itself.\n\nThe second thing is that I am bad at exactly one part of this and I have stopped pretending otherwise. I have the relationship-maintenance patience of somebody who scored in the bottom percentile for agreeableness, because I did. So the seats I take are the ones where being direct early is the point, and I have turned down work that needed twelve months of hand-holding, which is work I would have taken three years ago and quietly ruined.\n\nThe third thing is the school piece, which nobody expects to hear is useful. Legal studies with a real estate focus turns out to be the most practical education I could have picked for the businesses I want to own, and it forces a weekly rhythm on a calendar that would otherwise be entirely reactive.\n\nAnd the part I will not dress up: things do get dropped. I forget what is next on my own calendar with some regularity, because I am fully present on whatever is in front of me and my working memory does not extend past it. That is a real cost and I have not solved it, I have just stopped calling it a personality quirk.\n\nNone of this is a productivity system. It is a small number of things I am genuinely suited for, structured so they do not need me at the same time.","cta":"If you are running more than one thing, what did you have to stop doing to make it hold?","heuristics":["Authority through concurrent demand","Disarming honesty bias","Specificity","Objection preemption"],"source":"Master List — 6 Associations: active fractional CMO for two companies concurrently with Velocity Demos; 1 Origins: Legal Studies at UGA while running the agency; 8 Likability: fully present on what is in front of him at the cost of forgetting what is next","flag":"Do NOT name the two fractional CMO companies. The vault names them but does not record permission to name them publicly. Also: Imperium Academy stays out of this post until standing is confirmed."},{"n":30,"date":"2026-10-13","dow":"Tue","week":5,"platform":"Short-form video","pillar":"Behind the scenes","format":"Screen recording + voiceover, 60-75s","title":"Thirty days, one rule","hooks":["I posted every day for thirty days with one rule, and the rule was that every claim had to be traceable.","Thirty days of content and not one invented number. Here is what that cost me and what it bought.","I want to show you the thing I have been building while all of this was going out."],"script":"I just posted every day for thirty days, and there was one rule the whole way through. Every number had to trace back to something real, or it did not go out.\n\nThat rule cost me things. A few posts got weaker. A stat I had been repeating for months turned out to have no source behind it and I cut it. One case study lost its most impressive figure because the number was still unconfirmed and unconfirmed is the same as untrue until it is not.\n\nWhat it bought is the only thing I care about, which is that if you go check any of it, it holds.\n\nMeanwhile I have been building software that reads a specific prospect and picks the psychological angle most likely to get that person to reply, instead of sending the same message to everybody and calling it personalization. It is not finished. The core still does not have a name and a bunch of you sent me candidates that were better than mine.\n\nSo the next thirty days is the build, in public, including the parts that do not work.\n\nProof beats performance. That was the whole month. Nothing I said this month is going to be worth anything if the receipts do not survive somebody checking, and everything I said this month will survive somebody checking.","production":"Screen recording of the actual product in progress, real interface, unfinished states visible. Voiceover rather than talking head — the build is the visual. On-screen at close — PROOF BEATS PERFORMANCE. End on the product, not on a face.","cta":"Following along for the build? Say so and I will keep posting the ugly parts.","heuristics":["Disarming honesty bias","Reciprocation","Social proof (naming submissions)","Curiosity gap"],"source":"Master List — 8 Likability: building Smooth Operator in public including the unfinished parts; Named Frameworks — lever selection mechanism still unnamed; Content Calendar Ideas — 'Building an AI cold email tool in public'","flag":"Ties back to Day 20's naming poll — check that thread for submissions before shooting. If nothing good came in, cut that clause."}];
const STATUSES=["Not started","Scripted","Shot","Scheduled","Posted"];
const WEEKS={1:"Proof, and the enemy named",2:"Making the wins believable",3:"The frameworks, taught",4:"The rooms and the standard",5:"Synthesis and what is next"};
const TODAY="2026-09-14";
const state={filters:{platform:new Set(),flag:false,todo:false},q:"",open:null,rec:{}};
let db=null,room=null;
const $=id=>document.getElementById(id);
const PSHORT={"Wins":"WINS","Enemies":"ENEMIES","Flaws":"FLAWS","Origins":"ORIGINS","Dogma":"DOGMA","Language / Isms":"LANGUAGE","Networking / Rooms":"ROOMS","Behind the scenes":"BTS","Mindset":"MINDSET","Associations":"ASSOC"};
const VSHORT={"Short-form video":"REEL","LinkedIn":"LI","YouTube":"YT","X":"X"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const rec=n=>state.rec[pad(n)]||{status:"Not started",assignee:"",notes:[]};
const me=()=>localStorage.getItem("pm-name")||"";

function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,1900)}
function copy(text,label){navigator.clipboard.writeText(text).then(()=>toast(label+" copied"),()=>toast("Could not copy"))}
function fdate(iso){const d=new Date(iso+"T12:00:00");return d.toLocaleDateString("en-US",{month:"short",day:"numeric"})}

function visible(){
  const f=state.filters,q=state.q.toLowerCase();
  return DAYS.filter(d=>{
    if(f.platform.size&&!f.platform.has(d.platform))return false;
    if(f.flag&&!d.flag)return false;
    if(f.todo&&rec(d.n).status==="Posted")return false;
    if(q){const b=(d.title+" "+d.hooks.join(" ")+" "+d.script+" "+d.pillar).toLowerCase();if(!b.includes(q))return false}
    return true;
  });
}

function renderStrip(){
  $("strip").innerHTML=DAYS.map(d=>{
    const r=rec(d.n);
    return `<button class="tick${d.date===TODAY?" today":""}" data-s="${esc(r.status)}" data-n="${d.n}"
      title="Day ${d.n} — ${esc(d.title)} — ${esc(r.status)}"><span>${d.n}</span></button>`;
  }).join("");
}

function renderMain(){
  const vis=visible();
  if(!vis.length){$("main").innerHTML='<p class="empty">Nothing matches those filters.</p>';return}
  let html="";
  for(const w of [1,2,3,4,5]){
    const days=vis.filter(d=>d.week===w);
    if(!days.length)continue;
    const posted=days.filter(d=>rec(d.n).status==="Posted").length;
    html+=`<div class="weekhead"><h2>Week ${w}</h2><span class="weekarc">${esc(WEEKS[w])}</span>
      <span class="weekcount">${posted}/${days.length} posted</span></div><div class="grid">`;
    for(const d of days){
      const r=rec(d.n);
      html+=`<button class="card${d.date===TODAY?" today":""}" data-n="${d.n}">
        <div class="crow"><span class="daynum">DAY ${pad(d.n)}</span>
          <span class="cdate">${d.dow} ${fdate(d.date)}</span></div>
        <h3 class="ctitle">${esc(d.title)}</h3>
        <p class="chook">${esc(d.hooks[0])}</p>
        <div class="cfoot">
          <span class="tag">${esc(VSHORT[d.platform]||d.platform)}</span>
          <span class="tag">${esc(PSHORT[d.pillar]||d.pillar)}</span>
          ${d.flag?'<span class="flagdot">Check</span>':""}
          <span class="pill" data-s="${esc(r.status)}">${esc(r.status)}</span>
          ${r.assignee?`<span class="who">${esc(r.assignee)}</span>`:""}
        </div></button>`;
    }
    html+="</div>";
  }
  $("main").innerHTML=html;
}

function renderSheet(){
  const n=state.open; if(n==null){$("sheet").hidden=true;$("scrim").hidden=true;return}
  const d=DAYS.find(x=>x.n===n),r=rec(n);
  $("scrim").hidden=false;$("sheet").hidden=false;$("sheet").scrollTop=0;
  $("sheet").innerHTML=`
   <div class="shead">
     <div class="crow" style="justify-content:space-between">
       <div><span class="daynum">DAY ${pad(d.n)}</span>
         <span class="cdate"> · ${d.dow} ${fdate(d.date)} · ${esc(d.platform)}</span></div>
       <button class="iconbtn" id="close" aria-label="Close">✕</button>
     </div>
     <h2 style="font-family:var(--read);font-weight:400;font-size:23px;margin:8px 0 0;letter-spacing:-.015em">${esc(d.title)}</h2>
   </div>
   <div class="sbody">
     ${d.flag?`<div class="flagbox"><strong>Verify before posting.</strong> ${esc(d.flag)}</div>`:""}

     <div class="sec"><div class="sechead"><span class="slug">Status</span></div>
       <div class="statusrow">${STATUSES.map(s=>`<button class="chip" data-set="${esc(s)}" aria-pressed="${r.status===s}">${esc(s)}</button>`).join("")}</div>
       <div class="srow" style="margin-top:6px">
         <input class="inp" id="assignee" placeholder="Assign to (name)" value="${esc(r.assignee)}">
         <button class="btn" id="saveassign">Save</button>
       </div>
     </div>

     <div class="sec"><div class="sechead"><span class="slug">Hooks — pick one</span></div>
       ${d.hooks.map((h,i)=>`<div class="hookrow"><span class="hooklab">${"ABC"[i]}</span>
         <p>${esc(h)}</p><button class="btn" data-copy="hook${i}">Copy</button></div>`).join("")}
     </div>

     <div class="sec"><div class="sechead"><span class="slug">Script — ${esc(d.format)}</span>
       <button class="btn" data-copy="script" style="margin-left:auto">Copy script</button>
       <button class="btn primary" id="prompt">Teleprompter</button></div>
       <div class="script">${esc(d.script)}</div>
     </div>

     ${d.production?`<div class="sec"><div class="sechead"><span class="slug">Production</span></div>
       <div class="notebox">${esc(d.production)}</div></div>`:""}

     <div class="sec"><div class="sechead"><span class="slug">Call to action</span>
       <button class="btn" data-copy="cta" style="margin-left:auto">Copy</button></div>
       <div class="notebox">${esc(d.cta)}</div></div>

     <div class="sec"><div class="sechead"><span class="slug">Levers pulled</span></div>
       <div class="hlist">${d.heuristics.map(h=>`<span class="tag">${esc(h)}</span>`).join("")}</div>
       <div class="srcbox" style="margin-top:8px">${esc(d.source)}</div>
     </div>

     <div class="sec"><div class="sechead"><span class="slug">Notes${db?"":" — local only, no shared store"}</span></div>
       ${r.notes.length?r.notes.map(nt=>`<div class="note"><b>${esc(nt.by||"someone")} · ${esc(nt.at||"")}</b>${esc(nt.text)}</div>`).join(""):'<p style="color:var(--ink-3);font-size:13px;margin:0">No notes yet.</p>'}
       <div class="srow"><input class="inp" id="notetext" placeholder="Leave a note for the team">
         <button class="btn" id="addnote">Add</button></div>
     </div>
   </div>`;

  $("close").onclick=closeSheet;
  $("prompt").onclick=()=>openPrompter(d);
  $("sheet").querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.copy;
    if(k==="script")copy(d.script,"Script");
    else if(k==="cta")copy(d.cta,"CTA");
    else copy(d.hooks[+k.slice(4)],"Hook");
  });
  $("sheet").querySelectorAll("[data-set]").forEach(b=>b.onclick=()=>save(n,{status:b.dataset.set}));
  $("saveassign").onclick=()=>save(n,{assignee:$("assignee").value.trim()});
  $("addnote").onclick=()=>{
    const t=$("notetext").value.trim(); if(!t)return;
    let who=me(); if(!who){who=(prompt("Your name, so the team knows who left this:")||"").trim();
      if(who)localStorage.setItem("pm-name",who)}
    save(n,{notes:[...r.notes,{by:who||"someone",text:t,at:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric"})}]});
  };
}

function save(n,patch){
  const key=pad(n),cur=rec(n),next={status:cur.status,assignee:cur.assignee,notes:cur.notes,...patch};
  state.rec[key]=next; renderStrip(); renderMain(); renderSheet();
  if(db)db.doc("days/"+key).set(next).catch(e=>toast(e.code==="revoked"?"Lost access to the shared board":"Saved here only"));
  else toast("Saved on this device");
}

function closeSheet(){state.open=null;renderSheet()}

/* teleprompter */
let tpTimer=null;
function openPrompter(d){
  $("tptext").textContent=d.script;
  $("tp").hidden=false;$("tpbar").hidden=false;$("tp").scrollTop=0;
}
function stopScroll(){clearInterval(tpTimer);tpTimer=null;$("tpplay").textContent="Scroll"}
$("tpclose").onclick=()=>{stopScroll();$("tp").hidden=true;$("tpbar").hidden=true};
$("tpplay").onclick=()=>{
  if(tpTimer){stopScroll();return}
  $("tpplay").textContent="Pause";
  tpTimer=setInterval(()=>{
    const el=$("tp");el.scrollTop+=Number($("tpspeed").value)*0.6;
    if(el.scrollTop+el.clientHeight>=el.scrollHeight-2)stopScroll();
  },16);
};
$("tp").onclick=()=>$("tpplay").click();

/* wiring */
$("range").textContent="Sep 14 — Oct 13, 2026 · @juliusxyoung";
$("theme").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
};
$("search").oninput=e=>{state.q=e.target.value;renderMain()};
$("filters").addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c)return;
  const {f,v}=c.dataset;
  if(f==="platform"){state.filters.platform.has(v)?state.filters.platform.delete(v):state.filters.platform.add(v);
    c.setAttribute("aria-pressed",state.filters.platform.has(v))}
  else{state.filters[f]=!state.filters[f];c.setAttribute("aria-pressed",state.filters[f])}
  renderMain();
});
document.addEventListener("click",e=>{
  const c=e.target.closest(".card,.tick"); if(!c)return;
  state.open=+c.dataset.n; renderSheet();
});
$("scrim").onclick=closeSheet;
document.addEventListener("keydown",e=>{
  if(e.key!=="Escape")return;
  if(!$("tp").hidden){$("tpclose").click();return}
  if(state.open!=null)closeSheet();
});

renderStrip();renderMain();

/* live shared board — lights up if the capability resolves */
const cap=(n)=>{try{return window.claude&&window.claude.use?window.claude.use(n):Promise.resolve(null)}catch(e){return Promise.resolve(null)}};
cap("db").then(x=>{
  db=x; if(!db)return;
  db.collection("days").onSnapshot(snap=>{
    snap.docs.forEach(doc=>{
      const v=doc.data()||{};
      state.rec[doc.id]={status:v.status||"Not started",assignee:v.assignee||"",notes:Array.isArray(v.notes)?v.notes:[]};
    });
    renderStrip();renderMain();if(state.open!=null)renderSheet();
  },e=>{if(e.code!=="revoked")toast("Shared board unavailable")});
}).catch(()=>{});

cap("room").then(r=>{
  room=r; if(!room)return;
  room.presence({name:me()||"Someone"});
  room.onPeers(()=>{
    const n=room.peers().length;
    $("presence").hidden=n<2;
    $("pcount").textContent=n+" here now";
  });
}).catch(()=>{});
</script>
